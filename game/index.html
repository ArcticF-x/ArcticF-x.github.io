<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | MagnetGame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-status" style="margin-top:8px;text-align:center;font:12px/1.5 Arial,sans-serif;color:#ffffff;opacity:.85;white-space:nowrap"></div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MagnetGame</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game.loader.js";

      // GitHub Pages does not send a Content-Encoding header for pre-compressed files,
      // so the payload is decompressed in the browser instead of relying on the server.
      // Unity's own "Decompression Fallback" option does the same thing; this build was
      // exported without it, so the equivalent logic lives here.
      var buildAssets = [
        { key: "dataUrl", file: "game.data.gz", type: "application/octet-stream", from: 0, to: 0.76 },
        { key: "codeUrl", file: "game.wasm.gz", type: "application/wasm", from: 0.76, to: 0.99 },
        { key: "frameworkUrl", file: "game.framework.js.gz", type: "text/javascript", from: 0.99, to: 1 }
      ];

      var config = {
        arguments: [],
        dataUrl: "",
        frameworkUrl: "",
        codeUrl: "",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Gcore",
        productName: "MagnetGame",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var progressBar = document.querySelector("#unity-progress-bar-full");
      var statusText = document.querySelector("#unity-status");

      function setProgress(fraction, text) {
        progressBar.style.width = Math.max(0, Math.min(1, fraction)) * 100 + "%";
        statusText.textContent = text;
      }

      function formatMB(bytes) {
        return ((bytes || 0) / 1048576).toFixed(1) + " MB";
      }

      function formatTime(seconds) {
        if (!isFinite(seconds) || seconds <= 0) return "0 秒";
        var minutes = Math.floor(seconds / 60);
        return minutes > 0 ? minutes + " 分 " + Math.round(seconds % 60) + " 秒" : Math.round(seconds) + " 秒";
      }

      async function fetchDecompressed(asset, onProgress) {
        var response = await fetch(buildUrl + "/" + asset.file);
        if (!response.ok) throw new Error("无法下载 " + asset.file + "（HTTP " + response.status + "）");

        var total = parseInt(response.headers.get("Content-Length"), 10) || 0;
        var reader = response.body.getReader();
        var chunks = [];
        var received = 0;
        for (;;) {
          var chunk = await reader.read();
          if (chunk.done) break;
          chunks.push(chunk.value);
          received += chunk.value.length;
          onProgress(received, total);
        }

        var decompressed = new Response(
          new Blob(chunks).stream().pipeThrough(new DecompressionStream("gzip"))
        );
        var buffer = await decompressed.arrayBuffer();
        return URL.createObjectURL(new Blob([buffer], { type: asset.type }));
      }

      async function boot() {
        if (typeof DecompressionStream === "undefined") {
          unityShowBanner("当前浏览器不支持 DecompressionStream，无法解压游戏资源，请使用较新的 Chrome / Edge / Safari。", "error");
          return;
        }

        var startedAt = performance.now();

        for (var i = 0; i < buildAssets.length; i++) {
          var asset = buildAssets[i];
          startedAt = performance.now();
          config[asset.key] = await fetchDecompressed(asset, function (received, total) {
            var fraction = asset.from + (asset.to - asset.from) * (total ? received / total : 0);
            var speed = received / Math.max((performance.now() - startedAt) / 1000, 0.5);
            var remaining = total ? (total - received) / Math.max(speed, 1) : 0;
            setProgress(fraction, "正在加载游戏资源 " + formatMB(received) + " / " + formatMB(total) +
              "（" + formatMB(speed) + "/s，剩余约 " + formatTime(remaining) + "）");
          });
        }

        setProgress(1, "资源已就绪，正在启动引擎…");

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            setProgress(0.99 + 0.01 * progress, "正在启动引擎… " + Math.round(progress * 100) + "%");
          }).then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };

          }).catch((message) => {
            alert(message);
          });
        };

        document.body.appendChild(script);
      }

      boot().catch(function (error) {
        console.error(error);
        unityShowBanner(error && error.message ? error.message : String(error), "error");
      });

    </script>
  </body>
</html>
